<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INVEH - Inventario de vehículos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link href="CSS/style.css" rel="stylesheet">
  </head>
  <body>
    <main class="container py-4">
      <h1 class="mb-4">Inventario de vehículo</h1>

      <div id="alerta-sucursal" aria-live="polite"></div>

      <section aria-labelledby="titulo-inventario">
        <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3">
          <h2 id="titulo-inventario" class="h4 mb-0">Vehículos disponibles</h2>

          <div>
            <label for="selector-divisa" class="form-label">Divisa</label>
            <select id="selector-divisa" class="form-select" aria-label="Seleccionar divisa">
              <option value="USD" selected>USD</option>
              <option value="EUR">EUR</option>
              <option value="MXN">MXN</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th scope="col">Vehículo</th>
                <th scope="col">Sucursal</th>
                <th scope="col">Precio</th>
              </tr>
            </thead>
            <tbody id="tabla-inventario">
              <!-- renderizarTabla() debe completar las filas del inventario. -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="JS/script.js"></script>
  </body>
</html>
